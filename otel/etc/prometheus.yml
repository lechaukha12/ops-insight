global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: aggregated-trace-metrics
    static_configs:
      - targets: ['otel-collector:8889']
    honor_labels: true
    scrape_interval: 15s
  - job_name: otel
    static_configs:
      - targets: ['otel-collector:8888']
    scrape_interval: 15s
  - job_name: 'tempo'
    static_configs:
      - targets: [ 'tempo:3200' ]
