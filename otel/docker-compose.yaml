services:
  otel-collector:
    container_name: otel_collector
    image: otel/opentelemetry-collector-contrib:0.107.0
    command:
      - "--config=/conf/config.yaml"
    volumes:
      - ./etc/otel-collector-config.yaml:/conf/config.yaml
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Asia/Ho_Chi_Minh
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP http receiver
      - "8889:8889" # Span metrics
      - "8888:8888" # Otel metrics
    restart: always
    depends_on:
      - tempo
      - insight-service

  tempo:
    container_name: tempo
    image: grafana/tempo:2.6.1
    command: [ "-config.file=/etc/tempo.yaml" ]
    ports:
      - "3200:3200"
      - "14250" 
    volumes:
      - ./etc/tempo.yaml:/etc/tempo.yaml
      - /etc/localtime:/etc/localtime:ro
      - tempo-storage:/var/tempo
    environment:
      - TZ=Asia/Ho_Chi_Minh
    restart: always
    deploy:
      resources:
        limits:
          memory: "10G"

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./etc/prometheus.yml:/etc/prometheus/prometheus.yml
      - /etc/localtime:/etc/localtime:ro
      - prometheus-storage:/prometheus
    environment:
      - TZ=Asia/Ho_Chi_Minh
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
      - --storage.tsdb.retention.time=24h
    restart: always
    deploy:
      resources:
        limits:
          memory: "16G"

  loki:
    image: grafana/loki:3.1.2
    container_name: loki
    ports:
      - 3100:3100
    command: -config.file=/etc/loki/loki.yaml
    environment:
      - TZ=Asia/Ho_Chi_Minh
    restart: always
    deploy:
      resources:
        limits:
          memory: "10G"
    volumes:
      - ./etc/loki.yaml:/etc/loki/loki.yaml
      - /etc/localtime:/etc/localtime:ro
      - loki-storage:/loki
      - "/etc/timezone:/etc/timezone:ro"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: always
    environment:
      MINIO_ROOT_USER: devops
      MINIO_ROOT_PASSWORD: 123456a@
    command: server --console-address ":9001" /data
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - minio-data:/data

  grafana:
    container_name: grafana
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    restart: always
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_BASIC_ENABLED=false
    volumes:
      - ./etc/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - grafana-storage:/var/lib/grafana

  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9002:9000"
    environment:
      - CLICKHOUSE_DB=insight
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    restart: always

  insight-service:
    build: ./insight
    container_name: insight_service
    ports:
      - "8000:8000"
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DB=insight
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
    depends_on:
      - clickhouse
    restart: always

  mock-generator:
    container_name: mock_generator
    image: python:3.11-slim
    volumes:
      - ./mock:/app
      - /etc/localtime:/etc/localtime:ro
    working_dir: /app
    command: sh -c "pip install --no-cache-dir opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp && python generator.py"
    restart: always
    depends_on:
      - otel-collector

volumes:
  tempo-storage:
  grafana-storage:
  prometheus-storage:
  loki-storage:
  minio-data:
  clickhouse-data:
